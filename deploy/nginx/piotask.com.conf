# nginx site for piotask.com — reverse-proxies to the TechpioAsset containers
# (web on 127.0.0.1:3000, api on 127.0.0.1:3001). Coexists with PioDeploy; do
# not touch the existing piodeploy.com config.
#
# Install on the VPS:
#   cp deploy/nginx/piotask.com.conf /etc/nginx/sites-available/piotask.com
#   ln -sf /etc/nginx/sites-available/piotask.com /etc/nginx/sites-enabled/piotask.com
#   nginx -t && systemctl reload nginx
# Then, once piotask.com DNS points at this server:
#   certbot --nginx -d piotask.com          # adds the TLS server block + redirect

server {
    listen 80;
    listen [::]:80;
    server_name piotask.com;

    # Uploads: MAX_UPLOAD_MB defaults to 25; allow headroom.
    client_max_body_size 30m;

    # Android app download — the self-built APK, served from disk (not the web
    # container). Copy the APK to /var/www/piotask-downloads/techpioasset.apk.
    location = /downloads/techpioasset.apk {
        alias /var/www/piotask-downloads/techpioasset.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="techpioasset.apk"';
    }

    # API + health endpoints → NestJS container.
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /health/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else → Next.js container.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# www → apex (DNS: A www → this server, added 2026-08-01; the old CNAME to the
# Hostinger CDN served a parked page). Certbot manages the 443 listener + cert
# (one certificate covering piotask.com and www.piotask.com, via --expand).
server {
    listen 80;
    listen [::]:80;
    server_name www.piotask.com;
    return 301 https://piotask.com$request_uri;
}
