# nginx site for piotask.com — reverse-proxies to the TechpioAsset containers
# (web on 127.0.0.1:3000, api on 127.0.0.1:3001). Coexists with PioDeploy; do
# not touch the existing piodeploy.com config.
#
# Install on the VPS:
#   cp deploy/nginx/piotask.com.conf /etc/nginx/sites-available/piotask.com
#   ln -sf /etc/nginx/sites-available/piotask.com /etc/nginx/sites-enabled/piotask.com
#   nginx -t && systemctl reload nginx
# Then, once piotask.com DNS points at this server:
#   certbot --nginx -d piotask.com          # adds the TLS server block + redirect

server {
    listen 80;
    listen [::]:80;
    server_name piotask.com;

    # Uploads: MAX_UPLOAD_MB defaults to 25; allow headroom.
    client_max_body_size 30m;

    # API + health endpoints → NestJS container.
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /health/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else → Next.js container.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
